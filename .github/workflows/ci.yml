name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build_and_test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Fetch YMM4 Build Libraries
        shell: pwsh
        run: ./scripts/fetch-ymm4-libs.ps1 -OutputDir "libs/YMM4"

      - name: Restore
        run: dotnet restore .\YMMPXLib.slnx

      - name: Build
        run: dotnet build .\YMMPXLib.slnx -c Release --no-restore

      - name: Test
        run: dotnet test .\YMMPXLib.slnx -c Release --no-build

      - name: Verify Formatting
        run: dotnet format .\YMMPXLib.slnx --verify-no-changes --no-restore

      - name: Verify Diff
        run: |
          git diff --check
          git show --check --format= HEAD

      - name: Audit Dependencies
        shell: pwsh
        run: |
          ./scripts/audit-dotnet-packages.ps1 -Audit vulnerable
          ./scripts/audit-dotnet-packages.ps1 -Audit deprecated
